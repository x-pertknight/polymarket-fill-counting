name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # compute.py uses the standard library only, so no packages are installed.
      # score.py is not run: it needs data/frame_raw.jsonl, which is not in the repo (see README).
      # The committed files must match the pins before compute.py rewrites data/results_all.json.
      - name: Committed shipped files match SHA256SUMS
        run: sha256sum -c --strict SHA256SUMS
      - name: Recompute every study number from the shipped files
        run: python3 -I code/compute.py all
      # git status also catches a results file that was deleted and recreated as untracked.
      - name: The recompute is byte identical to the committed files
        run: git diff --exit-code && test -z "$(git status --porcelain)"
